<!DOCTYPE html>

<html lang="pt-BR">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Meu Centro Financeiro</title>

    <link
        rel="stylesheet"
        href="css/style.css"
    >

</head>


<body>


<div class="app">


    <!-- MENU -->

    <aside class="sidebar">

        <div class="logo">

            Meu
            <span>Dinheiro</span>

        </div>


        <nav class="menu">

            <button class="active">
                🏠 Dashboard
            </button>

            <button>
                💸 Gastos
            </button>

            <button>
                💰 Receitas
            </button>

            <button>
                🎯 Metas
            </button>

            <button>
                📊 Relatórios
            </button>

            <button>
                ⚙️ Configurações
            </button>

        </nav>

    </aside>


    <!-- CONTEÚDO -->

    <main class="content">


        <div class="header">

            <div>

                <h1>
                    Olá! 👋
                </h1>

                <p>
                    Vamos cuidar do seu dinheiro hoje.
                </p>

            </div>


            <div>

                Agosto 2026

            </div>

        </div>


        <!-- CARDS -->

        <div class="cards">


            <div class="card">

                <div class="card-title">
                    Saldo disponível
                </div>

                <div class="card-value blue">
                    R$ 0,00
                </div>

            </div>


            <div class="card">

                <div class="card-title">
                    Entradas
                </div>

                <div class="card-value green">
                    R$ 0,00
                </div>

            </div>


            <div class="card">

                <div class="card-title">
                    Gastos
                </div>

                <div class="card-value red">
                    R$ 0,00
                </div>

            </div>


            <div class="card">

                <div class="card-title">
                    Economia
                </div>

                <div class="card-value purple">
                    R$ 0,00
                </div>

            </div>


        </div>


    </main>


</div>


</body>

</html>
