<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Meu Centro Financeiro</title>

  <link rel="stylesheet" href="css/style.css">
</head>

<body>

  <header class="topo">

    <div>
      <h1>💰 Meu Centro Financeiro</h1>
      <p>Organize seu dinheiro de forma simples.</p>
    </div>

    <button onclick="abrirFormulario()">
      + Novo lançamento
    </button>

  </header>


  <main>

    <!-- ============================= -->
    <!-- RESUMO FINANCEIRO -->
    <!-- ============================= -->

    <section class="resumo">

      <div class="card">

        <span>Saldo</span>

        <strong id="saldo">
          R$ 0,00
        </strong>

      </div>


      <div class="card receita">

        <span>Receitas</span>

        <strong id="receitas">
          R$ 0,00
        </strong>

      </div>


      <div class="card despesa">

        <span>Despesas</span>

        <strong id="despesas">
          R$ 0,00
        </strong>

      </div>

    </section>


    <!-- ============================= -->
    <!-- FORMULÁRIO -->
    <!-- ============================= -->

    <section
      id="formulario"
      class="formulario"
      style="display:none;"
    >

      <h2>Novo lançamento</h2>


      <form onsubmit="salvarFormulario(event)">

        <label>
          Tipo
        </label>

        <select id="tipo" required>

          <option value="receita">
            Receita
          </option>

          <option value="despesa">
            Despesa
          </option>

        </select>


        <label>
          Descrição
        </label>

        <input
          type="text"
          id="descricao"
          placeholder="Ex.: Salário"
          required
        >


        <label>
          Valor
        </label>

        <input
          type="number"
          id="valor"
          placeholder="0,00"
          step="0.01"
          min="0"
          required
        >


        <label>
          Categoria
        </label>

        <select id="categoria" required>

          <option value="Salário">
            Salário
          </option>

          <option value="Alimentação">
            Alimentação
          </option>

          <option value="Casa">
            Casa
          </option>

          <option value="Transporte">
            Transporte
          </option>

          <option value="Lazer">
            Lazer
          </option>

          <option value="Compras">
            Compras
          </option>

          <option value="Saúde">
            Saúde
          </option>

          <option value="Educação">
            Educação
          </option>

          <option value="Outros">
            Outros
          </option>

        </select>


        <div class="botoes">

          <button
            type="submit"
          >
            Salvar lançamento
          </button>


          <button
            type="button"
            onclick="fecharFormulario()"
          >
            Cancelar
          </button>

        </div>

      </form>

    </section>


    <!-- ============================= -->
    <!-- LANÇAMENTOS -->
    <!-- ============================= -->

    <section class="lista">

      <div class="titulo-lista">

        <h2>
          Últimos lançamentos
        </h2>

      </div>


      <div id="listaLancamentos">

        <p class="vazio">
          Nenhum lançamento cadastrado ainda.
        </p>

      </div>

    </section>

  </main>


  <footer>

    <p>
      Meu Centro Financeiro © 2026
    </p>

  </footer>


  <!-- ============================= -->
  <!-- JAVASCRIPT -->
  <!-- ============================= -->

  <script src="js/app.js"></script>


  <script>

    function abrirFormulario() {

      document.getElementById(
        "formulario"
      ).style.display = "block";

    }


    function fecharFormulario() {

      document.getElementById(
        "formulario"
      ).style.display = "none";

    }


    function salvarFormulario(event) {

      event.preventDefault();


      const tipo =
        document.getElementById(
          "tipo"
        ).value;


      const descricao =
        document.getElementById(
          "descricao"
        ).value;


      const valor =
        document.getElementById(
          "valor"
        ).value;


      const categoria =
        document.getElementById(
          "categoria"
        ).value;


      adicionarLancamento(
        tipo,
        descricao,
        valor,
        categoria
      );


      document.querySelector(
        "form"
      ).reset();


      fecharFormulario();

      atualizarLista();

    }


    function atualizarLista() {

      const lista =
        document.getElementById(
          "listaLancamentos"
        );


      if (
        typeof lancamentos === "undefined" ||
        lancamentos.length === 0
      ) {

        lista.innerHTML = `
          <p class="vazio">
            Nenhum lançamento cadastrado ainda.
          </p>
        `;

        return;

      }


      lista.innerHTML =
        lancamentos
          .slice()
          .reverse()
          .map(item => `

            <div class="lancamento">

              <div>

                <strong>
                  ${item.descricao}
                </strong>

                <small>
                  ${item.categoria}
                </small>

              </div>


              <strong class="${item.tipo}">

                ${
                  item.tipo === "receita"
                    ? "+"
                    : "-"
                }

                ${formatarMoeda(item.valor)}

              </strong>

            </div>

          `)
          .join("");

    }


    document.addEventListener(
      "DOMContentLoaded",
      atualizarLista
    );

  </script>

</body>
</html>
